<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <!-- Left hero: tagline + CSS phone collage (decorative) -->
    <section class="auth-hero" aria-hidden="true">
      <h1>See everyday moments<br>from your <span class="pop">close friends.</span></h1>
      <div class="collage">
        <div class="phone p1"></div>
        <div class="phone p2"></div>
        <div class="phone p3"></div>
        <div class="bubble heart">❤️</div>
        <div class="bubble star">⭐</div>
      </div>
    </section>

    <!-- Right column -->
    <div class="auth-col">
      <section class="card auth-box">
        <!-- Empty space reserved for a logo (no logo placed here) -->
        <div class="logo-slot">LOGO</div>

        <!-- LOGIN FORM -->
        <form id="loginForm" novalidate>
          <h2>Log in</h2>
          <input class="input" name="username" placeholder="Username or email address" autocomplete="username" required>
          <div class="pw-field">
            <input class="input" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" hidden>Show</button>
          </div>
          <button class="btn block" type="submit" disabled>Log in</button>
          <p class="error" id="loginError" role="alert"></p>
          <p class="forgot"><button type="button" class="link-btn" id="forgot">Forgotten password?</button></p>
          <div class="divider">OR</div>
          <button type="button" class="btn secondary block" id="toSignup">Create new account</button>
        </form>

        <!-- SIGN-UP FORM -->
        <form id="signupForm" novalidate hidden>
          <h2>Create a new account</h2>
          <p class="sub">Sign up to share photos with your friends.</p>
          <input class="input" name="email" type="email" placeholder="Email address" autocomplete="email" required>
          <input class="input" name="fullName" placeholder="Full name" autocomplete="name" required>
          <input class="input" name="username" placeholder="Username" autocomplete="username" required>
          <div class="pw-field">
            <input class="input" name="password" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" required>
            <button type="button" class="pw-toggle" hidden>Show</button>
          </div>
          <button class="btn block" type="submit" disabled>Sign up</button>
          <p class="error" id="signupError" role="alert"></p>
          <div class="divider">OR</div>
          <button type="button" class="btn secondary block" id="toLogin">I already have an account</button>
        </form>
      </section>

      <section class="card auth-switch">
        <span id="switchText">Don't have an account?</span>
        <button class="link-btn" id="switchLink" type="button">Sign up</button>
      </section>

      <p class="hint">Demo admin: <b>admin</b> / <b>admin123</b> (change via ADMIN_PASSWORD)</p>
    </div>
  </main>

  <footer class="auth-footer">
    <a href="#">About</a><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a>
    <a href="#">Locations</a><a href="#">Contact</a>
    <span>© 2026 Picto</span>
  </footer>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const switchLink = document.getElementById('switchLink');
    const switchText = document.getElementById('switchText');

    function showSignup(on) {
      loginForm.hidden = on;
      signupForm.hidden = !on;
      switchText.textContent = on ? 'Have an account?' : "Don't have an account?";
      switchLink.textContent = on ? 'Log in' : 'Sign up';
      document.title = on ? 'Sign up' : 'Log in';
      (on ? signupForm : loginForm).querySelector('input').focus();
    }
    switchLink.addEventListener('click', () => showSignup(loginForm.hidden === false));
    document.getElementById('toSignup').addEventListener('click', () => showSignup(true));
    document.getElementById('toLogin').addEventListener('click', () => showSignup(false));
    document.getElementById('forgot').addEventListener('click', () =>
      alert('Password reset is not part of this demo. Ask an admin to reset it, or sign up a new account.'));
    if (location.hash === '#signup') showSignup(true);

    // Enable submit only when every field is filled; wire show/hide password
    for (const form of [loginForm, signupForm]) {
      const btn = form.querySelector('button[type=submit]');
      const pw = form.querySelector('input[type=password]');
      const toggle = form.querySelector('.pw-toggle');
      form.addEventListener('input', () => {
        btn.disabled = [...form.querySelectorAll('input')].some((i) => !i.value.trim());
        toggle.hidden = !pw.value;
      });
      toggle.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Hide' : 'Show';
      });
    }

    async function submit(form, url, errorEl) {
      const btn = form.querySelector('button[type=submit]');
      errorEl.textContent = '';
      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = 'Please wait…';
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        location.href = data.role === 'admin' ? '/admin' : '/feed';
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    loginForm.addEventListener('submit', (e) => { e.preventDefault(); submit(loginForm, '/api/login', document.getElementById('loginError')); });
    signupForm.addEventListener('submit', (e) => { e.preventDefault(); submit(signupForm, '/api/register', document.getElementById('signupError')); });
  </script>
</body>
</html>
